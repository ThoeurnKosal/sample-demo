# Client-facing error messages (English, default). Keys come from ErrorCode#getMessageKey().
# java.text.MessageFormat syntax: {0} is a placeholder; a literal apostrophe must be written twice ('').
error.validation-failed=Request validation failed.
error.malformed-request=The request could not be read. Check the body, parameter types and required parameters.
error.unauthorized=Authentication is required. Send a valid bearer token.
error.access-denied=You are not allowed to perform this operation.
error.customer-not-found=Customer {0} was not found.
error.external-user-not-found=User {0} was not found in the customer directory.
error.route-not-found=No endpoint matches this URL.
error.method-not-allowed=This HTTP method is not supported for this URL.
error.not-acceptable=The requested response format is not supported. Accept application/json.
error.unsupported-media-type=This content type is not supported. Send application/json.
error.duplicate-customer=A customer with the same email or directory id already exists.
error.concurrent-modification=The resource was changed by another request. Reload it and try again.
error.customer-rule-violation=Customer data violates a business rule: {0}.
error.downstream-rejected=A downstream system rejected the request.
error.downstream-unavailable=A required downstream system is temporarily unavailable. Please retry later.
error.internal-error=An unexpected error occurred.

error.account-not-found=Account {0} was not found.
error.account-already-exists=Customer {0} already has an active {1} account.
error.account-not-active=Account {0} is closed. No money can be moved.
error.insufficient-funds=The balance of account {0} is lower than the requested amount.
error.account-balance-not-zero=Account {0} still has money. Withdraw the balance before closing it.
error.invalid-amount=Amount {0} {1} must be positive, have at most two decimals and keep the balance within the limit.
error.unsupported-currency=Currency {0} is not supported. Use USD or KHR.
